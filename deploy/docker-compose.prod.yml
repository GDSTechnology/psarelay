# ============================================================================
# REFERENCE TARGET DESIGN — NOT WHAT PRODUCTION RUNS TODAY.
#
# Current prod (verified 2026-09-29) is a SINGLE instance: service
# `autotask-mcp` (container `n8n-autotask-mcp-1`, 127.0.0.1:18080) in the
# `n8n` compose project at /opt/n8n/docker-compose.yml on the production host.
# There is no `autotask-mcp-gpt` / :18081 instance. Do not deploy from
# this file; the live deploy/rollback procedure is in DEPLOY.md.
# ============================================================================
#
# Target design: one MCP instance PER consumer class.
#
# Why two instances instead of one shared server: on a single shared instance
# every consumer (ChatGPT via the tunnel, n8n on the compose network, cron on
# the host) hits the same port, so the only "who is calling" signal is the
# client-declared `source` — spoofable, and absent on plain calls. Splitting by
# instance makes the calling container unambiguous (which port received it) AND
# gives a hard security boundary: impersonation is enabled ONLY where it should
# be, by config, so an internal automation can never tunnel a write as an
# arbitrary user.
#
#   autotask-mcp        (:18080)  n8n + cron + internal automations
#                                 AUTOTASK_IMPERSONATION_MODE=off  → runs as the
#                                 integration user, cannot impersonate anyone.
#   autotask-mcp-gpt    (:18081)  ChatGPT connector + Hermes-in-Teams
#                                 AUTOTASK_IMPERSONATION_MODE=caller → resolves
#                                 the calling user and attributes writes to them.
#
# Both stamp MCP_INSTANCE_LABEL into every audit record, so logs show which
# container served each call regardless of what the client declared. The
# transport origin (peer address / X-Forwarded-For / User-Agent) is captured
# automatically and logged next to it — no config needed.
#
# Both services track `:latest` so a deploy is just `docker compose pull <svc>
# && docker compose up -d <svc>` — no YAML edit per release (semantic-release publishes
# `:latest` alongside each version tag). Needs a release >= 3.2.0 for
# per-instance impersonation mode. To pin/roll back, replace `:latest` with a
# specific tag (e.g. `:3.2.0`) or a digest. Both services share the same
# Autotask API credentials in autotask-mcp.env (never commit real secrets —
# keep that file server-side).

services:
  # ── Internal automations: n8n workflows + cron scheduler ──────────────────
  autotask-mcp:
    image: ghcr.io/gdstechnology/psarelay:latest
    container_name: autotask-mcp-server
    restart: unless-stopped
    env_file:
      - ./autotask-mcp.env            # AUTOTASK_USERNAME / _SECRET / _INTEGRATION_CODE (+ _API_URL)
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8080"
      # Impersonation posture. Accepted values (exact): off | caller.
      # "off" = writes run as the integration user; n8n/cron cannot impersonate.
      # To turn impersonation on here later, change to "caller". Remove the line
      # or set "off" to disable. (Legacy AUTOTASK_IMPERSONATION=on|true|1|yes also
      # maps to caller, but AUTOTASK_IMPERSONATION_MODE wins — prefer it.)
      AUTOTASK_IMPERSONATION_MODE: "off"
      # Any non-empty string; stamped as `instanceLabel` on every audit record.
      MCP_INSTANCE_LABEL: n8n-cron
      LOG_LEVEL: info
      LOG_FORMAT: json
      NODE_ENV: production
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }
        reservations: { cpus: '0.1', memory: 128M }

  # ── User-facing assistants: ChatGPT connector + Hermes-in-Teams ───────────
  autotask-mcp-gpt:
    image: ghcr.io/gdstechnology/psarelay:latest
    container_name: autotask-mcp-gpt
    restart: unless-stopped
    env_file:
      - ./autotask-mcp.env            # same Autotask API credentials
    environment:
      MCP_TRANSPORT: http
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8080"
      # Impersonation posture. Accepted values (exact): off | caller.
      # "caller" resolves the calling user and tunnels writes as them
      # (ImpersonationResourceId). Requires the API user's Autotask security level
      # to permit impersonation. Set "off" (or remove) to disable.
      AUTOTASK_IMPERSONATION_MODE: caller
      # Optional (caller mode only) defense-in-depth allowlist: comma-separated
      # declared sources permitted to impersonate. Valid: chatgpt, hermes-teams,
      # telegram, n8n, cron. Remove this line to allow ALL sources.
      AUTOTASK_IMPERSONATION_SOURCES: "chatgpt,hermes-teams"
      # Any non-empty string; stamped as `instanceLabel` on every audit record.
      MCP_INSTANCE_LABEL: gpt-teams
      LOG_LEVEL: info
      LOG_FORMAT: json
      NODE_ENV: production
    ports:
      - "127.0.0.1:18081:8080"        # point the Cloudflare tunnel / Teams relay here
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }
        reservations: { cpus: '0.1', memory: 128M }

# NOTE: if this file lives in its own compose project, attach both services to
# the same external network your n8n stack uses so n8n can reach
# http://autotask-mcp:8080/mcp by service name, e.g.:
#
# networks:
#   default:
#     external: true
#     name: <your-n8n-compose-network>
