# gitleaks configuration — extends the default ruleset and allowlists a small
# set of KNOWN placeholder example credentials that appear in documentation
# (verified: no real secrets exist in the repo or its history, 2026-09-16).
#
# Documentation `curl` examples (historically the gateway migration guide) use placeholder header
# values (your-api-user@example.com / your-api-secret / your-integration-code),
# which the built-in `curl-auth-header` rule flags. These regexes allowlist only
# those exact placeholders — a real credential pasted into the docs would not
# match and would still be flagged.

[extend]
useDefault = true

[allowlist]
description = "Documentation placeholder example credentials (not real secrets)"
regexes = [
  '''your-api-user@example\.com''',
  '''your-api-secret''',
  '''your-integration-code''',
  '''your-username''',
  '''your-secret''',
]
