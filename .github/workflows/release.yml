name: Release

# GDS-native automated release. On push to main, semantic-release computes the
# next version from conventional commits, creates a git tag + GitHub Release with
# notes; if (and only if) a release was cut, a traceable Docker image is built and
# pushed to GHCR under the GDS namespace. No external reusable workflows, no
# registry token.
#
# .releaserc.json has no @semantic-release/git plugin, so nothing is pushed back
# to main; the release version lives in the git tag / GitHub Release, and the
# Dockerfile bakes it into the image (and /health) via the VERSION build-arg.

on:
  push:
    branches: [main]
  # Manual re-run for when GitHub drops the push event of a merge (seen
  # 2026-09-29: #141 merged, no workflow started). Run it from main — on any
  # other branch semantic-release finds no release branch and cuts nothing.
  workflow_dispatch:

permissions:
  contents: write        # create tags + GitHub Releases
  issues: write          # semantic-release/github comments
  pull-requests: write   # semantic-release/github comments
  packages: write        # push image to GHCR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.detect.outputs.released }}
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Record current release tag
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Detect new release
        id: detect
        run: |
          NEW="$(git describe --tags --abbrev=0 2>/dev/null || echo none)"
          if [ "$NEW" != "${{ steps.before.outputs.tag }}" ] && [ "$NEW" != "none" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=${NEW#v}" >> "$GITHUB_OUTPUT"
            echo "Released $NEW"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No release cut for this push."
          fi

  docker:
    name: Build & push image
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Multi-arch (linux/amd64 + linux/arm64, #74). QEMU emulates arm64 so the
      # single amd64 runner can build both; buildx assembles one manifest list
      # pushed under each tag, so consumers auto-select their arch. The image is
      # pure-Node on alpine with `npm ci --ignore-scripts`, so nothing is
      # compiled per-arch — the arm64 build is clean.
      - name: Record build date
        id: builddate
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push multi-arch (token-free SDK, traceable)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/gdstechnology/psarelay:${{ needs.release.outputs.version }}
            ghcr.io/gdstechnology/psarelay:latest
          build-args: |
            VERSION=${{ needs.release.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ steps.builddate.outputs.date }}
